[build]
  command = "curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.111.3/hugo_extended_0.111.3_linux-amd64.tar.gz | tar xz -C /tmp && cd exampleSite && /tmp/hugo --gc --minify -D -b $URL"
  publish = "exampleSite/public"

[build.environment]
HUGO_THEMESDIR = "../.."
HUGO_THEME = "repo"
TZ = "Europe/Paris"

[context.production.environment]
HUGO_ENV = "production"

[context.deploy-preview]
command = "curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.111.3/hugo_extended_0.111.3_linux-amd64.tar.gz | tar xz -C /tmp && cd exampleSite && /tmp/hugo --gc --minify -D -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
command = "curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.111.3/hugo_extended_0.111.3_linux-amd64.tar.gz | tar xz -C /tmp && cd exampleSite && /tmp/hugo --gc --minify -D -b $DEPLOY_PRIME_URL"