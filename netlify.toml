[build]
  base = "exampleSite"
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.125.0"
  GO_VERSION = "1.22.0"
  HUGO_THEMESDIR = "../.."   # Crucial : dit à Hugo de chercher le thème "congo" dans le dossier parent

[context.deploy-preview.environment]
  HUGO_VERSION = "0.125.0"
  GO_VERSION = "1.22.0"
  HUGO_THEMESDIR = "../.."
