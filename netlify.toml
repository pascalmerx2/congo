[build]
  base = "exampleSite"
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.125.0"
  GO_VERSION = "1.22.0"
  HUGO_THEMESDIR = "/opt/build"  # Indique à Hugo de chercher le thème à la racine du repo cloné

[context.deploy-preview.environment]
  HUGO_VERSION = "0.125.0"
  GO_VERSION = "1.22.0"
  HUGO_THEMESDIR = "/opt/build"
